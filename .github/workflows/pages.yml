name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 1. Minify using your exact esbuild setup (runs in runner memory)
      - name: Minify with esbuild
        run: npx esbuild src/vaRRI.js --minify --sourcemap --outfile=dist/vaRRI.min.js

      # 2. Point index.html to the minified file
      - name: Swap script path for production
        run: sed -i 's|src/vaRRI.js|dist/vaRRI.min.js|g' index.html

      # 3. Publish build output directly to GitHub Pages
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
