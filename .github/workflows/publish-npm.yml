name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="${RELEASE_TAG#v}"
          npm version "$package_version" --no-git-tag-version --allow-same-version

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --provenance --access public
        env:
          # Bootstraps the first publish; npm OIDC takes over once trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
