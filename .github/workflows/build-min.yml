name: Build Minified JS

on:
  push:
    branches: [ main ]
    paths:
      - 'src/vaRRI.js'

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Minify with esbuild
        run: npx esbuild src/vaRRI.js --minify --sourcemap --outfile=dist/vaRRI.min.js

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: minified JS updated [skip ci]"
          file_pattern: 'dist/*'
