<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vaRRI-js README</title>
  <link rel="icon" type="image/png" href="logo/vaRRI.logo.40x40.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  
  <style>
    .anchor-link {
      color: #999;
      text-decoration: none;
      margin-left: 0.3em;
      font-size: 0.8em;
      opacity: 0;
      transition: opacity 0.2s;
    }
    h1:hover .anchor-link,
    h2:hover .anchor-link,
    h3:hover .anchor-link,
    h4:hover .anchor-link,
    h5:hover .anchor-link,
    h6:hover .anchor-link {
      opacity: 1;
    }
    .anchor-link::before {
      content: "🔗";
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }
    .markdown-body h1, h2, h3, h4, h5, h6 {
        margin-left: -70px;
    }
    .status-banner {
      background-color: #fff8c5;
      border: 1px solid rgba(212, 167, 44, 0.4);
      padding: 8px 16px;
      margin-bottom: 20px;
      border-radius: 6px;
      font-size: 14px;
      color: #24292f;
    }
    @media (max-width: 767px) {
      .markdown-body { padding: 15px; }
    }
  </style>
</head>
<body>

  <article id="content" class="markdown-body">
    <div id="notice"></div>
    <div id="markdown-text">README wird geladen...</div>
  </article>

  <!-- Marked synchron laden -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
  // 0. Marked renderer setup
  const slugify = (text) => {
    return text
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');
  };

  const renderer = new marked.Renderer();

  renderer.heading = function(text, level) {
    let headerLevel = level;
    if (typeof headerLevel === 'string') headerLevel = parseInt(headerLevel, 10);
    if (typeof headerLevel !== 'number' || isNaN(headerLevel) || headerLevel < 1 || headerLevel > 6) headerLevel = 1;

    let headingText = text;
    if (typeof text === 'object') {
      headingText = text.text || (text.tokens ? text.tokens.map(t => t.text || t.raw || '').join('') : String(text));
    } else if (typeof text !== 'string') {
      headingText = String(text);
    }

    const id = slugify(headingText);

    return `<h${headerLevel} id="${id}">
      <a href="#${id}" class="anchor-link">#</a>
      ${headingText}
    </h${headerLevel}>`;
  };

  // 1. Check if the HTML file was opened locally (file://)
  const isLocalFile = window.location.protocol === 'file:';

  // 2. Configure Marked
  marked.use({
    headerIds: true,
    renderer: renderer,
    walkTokens(token) {
      // Replace the iframe with a note only in local mode (file://)
      if (isLocalFile && token.type === 'html' && typeof token.text === 'string' && token.text.includes('<iframe')) {
        // Optionally extract the URL from the iframe if present
        const srcMatch = token.text.match(/src=["']([^"']+)["']/);
        const iframeUrl = srcMatch ? srcMatch[1] : 'https://backofenlab.github.io/vaRRI-js/index.html';

        token.text = `
          <div class="status-banner" style="margin: 16px 0;">
            ℹ️ <strong>Interactive preview disabled in local mode:</strong><br>
            Loading embedded iFrames is blocked by browsers for locally opened HTML files (<code>file://</code>) for security reasons.<br>
            <a href="${iframeUrl}" target="_blank" rel="noopener noreferrer">👉 Click here to open the preview directly in a new tab</a>
          </div>
        `;
      }
    }
  });

  // 3. Define URLs
  const localUrl = './README.md';
  const remoteUrl = 'https://raw.githubusercontent.com/BackofenLab/vaRRI-js/main/README.md';

  // 4. Choose target URL
  const targetUrl = isLocalFile ? remoteUrl : localUrl;

  if (isLocalFile) {
    document.getElementById('notice').innerHTML = `
      <div class="status-banner">
        ⚠️ <strong>Note:</strong> 
        <blockquote style="margin: 8px;">
          README.html was opened locally and cannot access the local README.md.<br>
          Therefore, the README was loaded from the <a href="${remoteUrl}">vaRRI-js online repository</a>.
        </blockquote>
      </div>
    `;
  }

  // 5. Execute fetch
  fetch(targetUrl)
    .then(response => {
      if (!response.ok) throw new Error('Failed to load README');
      return response.text();
    })
    .then(text => {
      document.getElementById('markdown-text').innerHTML = marked.parse(text);
    })
    .catch(err => {
      document.getElementById('markdown-text').innerText = 'Error loading the README (' + err.message + ').';
    });
</script>
</body>
</html>
