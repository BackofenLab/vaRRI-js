<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  
  <style>
    .anchor-link {
      color: #999;
      text-decoration: none;
      margin-left: 0.3em;
      font-size: 0.8em;
      opacity: 0;
      transition: opacity 0.2s;
    }
    h1:hover .anchor-link,
    h2:hover .anchor-link,
    h3:hover .anchor-link,
    h4:hover .anchor-link,
    h5:hover .anchor-link,
    h6:hover .anchor-link {
      opacity: 1;
    }
    .anchor-link::before {
      content: "🔗";
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }
    .markdown-body h1, h2, h3, h4, h5, h6 {
        margin-left: -70px;
    }
    /* Styling für die Banner-Benachrichtigung */
    .status-banner {
      background-color: #fff8c5;
      border: 1px solid rgba(212, 167, 44, 0.4);
      padding: 8px 16px;
      margin-bottom: 20px;
      border-radius: 6px;
      font-size: 14px;
      color: #24292f;
    }
    @media (max-width: 767px) {
      .markdown-body { padding: 15px; }
    }
  </style>
</head>
<body>

  <article id="content" class="markdown-body">
    <div id="notice"></div>
    <div id="markdown-text">README wird geladen...</div>
  </article>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // 0. Setup des Marked-Renderers, um Links in neuen Tabs zu öffnen
      // ✅ Define your own slugify function
    const slugify = (text) => {
      return text
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    };

    const renderer = new marked.Renderer();

    renderer.heading = function(text, level) {
      // ✅ Validate and sanitize `level`
      let headerLevel = level;

      if (typeof headerLevel === 'string') {
        headerLevel = parseInt(headerLevel, 10);
      }

      if (typeof headerLevel !== 'number' || isNaN(headerLevel) || headerLevel < 1 || headerLevel > 6) {
        headerLevel = 1; // Fallback to h1
      }

      // ✅ Extract text safely
      let headingText = text;

      if (typeof text === 'object') {
        if (text.text) {
          headingText = text.text;
        } else if (text.tokens) {
          headingText = text.tokens.map(t => t.text || t.raw || '').join('');
        } else {
          headingText = String(text);
        }
      } else if (typeof text !== 'string') {
        headingText = String(text);
      }

      // ✅ Generate ID
      const id = slugify(headingText);

      // ✅ Render header with valid level
      return `<h${headerLevel} id="${id}">
        <a href="#${id}" class="anchor-link">#</a>
        ${headingText}
      </h${headerLevel}>`;
    };

    // Apply options
    marked.use({
      headerIds: true,
      renderer: renderer
    });

    // 1. URLs definieren
    const localUrl = './README.md';
    // Hier die Raw-URL deines Repos (z. B. GitHub, GitLab) eintragen:
    const remoteUrl = 'https://raw.githubusercontent.com/BackofenLab/vaRRI-js/main/README.md';

    // 2. Prüfen, ob die HTML-Datei lokal geöffnet wurde (file://)
    const isLocalFile = window.location.protocol === 'file:';

    // 3. Ziel-URL wählen
    const targetUrl = isLocalFile ? remoteUrl : localUrl;

    // Optional: Hinweis im UI anzeigen, wenn von der Online-Quelle geladen wird
    if (isLocalFile) {
      document.getElementById('notice').innerHTML = `
        <div class="status-banner">
          ⚠️ <strong>Hinweis:</strong> 
          <blockquote style="margin: 8px;">
            Die README.html wurde lokal geöffnet und kann nicht auf die lokale README.md zugreifen.<br>
            Daher wurde die README aus dem <a href="${remoteUrl}">vaRRI-js Online-Repository</a> geladen.
          </blockquote>
        </div>
      `;
    }

    // 4. Fetch ausführen
    fetch(targetUrl)
      .then(response => {
        if (!response.ok) throw new Error('README konnte nicht geladen werden');
        return response.text();
      })
      .then(text => {
        document.getElementById('markdown-text').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('markdown-text').innerText = 'Fehler beim Laden des READMEs (' + err.message + ').';
      });
  </script>
</body>
</html>
